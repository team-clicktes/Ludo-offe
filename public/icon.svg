<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="55%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090522" />
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="48%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="url(#goldFrame)" stroke-width="10" />

  <!-- Outer Golden Ludo Board Frame -->
  <rect x="76" y="76" width="360" height="360" rx="44" fill="url(#goldFrame)" />
  <rect x="92" y="92" width="328" height="328" rx="32" fill="#f8fafc" />

  <!-- 4 Colored Corner Bases -->
  <rect x="98" y="98" width="136" height="136" rx="22" fill="#ef4444" />
  <rect x="278" y="98" width="136" height="136" rx="22" fill="#22c55e" />
  <rect x="98" y="278" width="136" height="136" rx="22" fill="#3b82f6" />
  <rect x="278" y="278" width="136" height="136" rx="22" fill="#facc15" />

  <!-- Inner White Yards -->
  <rect x="116" y="116" width="100" height="100" rx="16" fill="#ffffff" />
  <rect x="296" y="116" width="100" height="100" rx="16" fill="#ffffff" />
  <rect x="116" y="296" width="100" height="100" rx="16" fill="#ffffff" />
  <rect x="296" y="296" width="100" height="100" rx="16" fill="#ffffff" />

  <!-- Pawn Dots (Red) -->
  <circle cx="144" cy="144" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
  <circle cx="188" cy="144" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
  <circle cx="144" cy="188" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
  <circle cx="188" cy="188" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="3" />

  <!-- Pawn Dots (Green) -->
  <circle cx="324" cy="144" r="14" fill="#22c55e" stroke="#166534" stroke-width="3" />
  <circle cx="368" cy="144" r="14" fill="#22c55e" stroke="#166534" stroke-width="3" />
  <circle cx="324" cy="188" r="14" fill="#22c55e" stroke="#166534" stroke-width="3" />
  <circle cx="368" cy="188" r="14" fill="#22c55e" stroke="#166534" stroke-width="3" />

  <!-- Pawn Dots (Blue) -->
  <circle cx="144" cy="324" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="3" />
  <circle cx="188" cy="324" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="3" />
  <circle cx="144" cy="368" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="3" />
  <circle cx="188" cy="368" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="3" />

  <!-- Pawn Dots (Yellow) -->
  <circle cx="324" cy="324" r="14" fill="#facc15" stroke="#a16207" stroke-width="3" />
  <circle cx="368" cy="324" r="14" fill="#facc15" stroke="#a16207" stroke-width="3" />
  <circle cx="324" cy="368" r="14" fill="#facc15" stroke="#a16207" stroke-width="3" />
  <circle cx="368" cy="368" r="14" fill="#facc15" stroke="#a16207" stroke-width="3" />

  <!-- Center Home Triangles -->
  <polygon points="234,234 256,256 234,278" fill="#ef4444" />
  <polygon points="234,234 278,234 256,256" fill="#22c55e" />
  <polygon points="278,234 278,278 256,256" fill="#facc15" />
  <polygon points="234,278 278,278 256,256" fill="#3b82f6" />

  <!-- Center Royal Crown Badge -->
  <circle cx="256" cy="256" r="56" fill="#1e1b4b" stroke="url(#goldFrame)" stroke-width="8" />
  <path
    d="M223 276 L218 242 L239 256 L256 230 L273 256 L294 242 L289 276 Z"
    fill="url(#crownGrad)"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <rect x="223" y="278" width="66" height="9" rx="4" fill="#fbbf24" />
</svg>
